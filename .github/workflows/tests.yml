name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project with dev dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]

      - name: Run tests
        run: |
          pytest -q
